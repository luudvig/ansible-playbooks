---

# sudo dnf -y install ansible && ansible-playbook -J -K main.yml

- hosts: localhost

  tasks:
    - import_tasks: software.yml

    - ansible.builtin.command:
        cmd: firewall-cmd --set-default-zone=drop
      register: command_result
      changed_when: "'ZONE_ALREADY_SET' not in command_result.stderr"

    - ansible.builtin.file:
        path: "{{ item.path }}"
        src: "{{ item.src | default(omit) }}"
        state: "{{ item.state }}"
        force: "{{ item.force | default(omit) }}"
      loop:
        - path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
          state: directory
        - path: "{{ ansible_facts.env.HOME }}/.newsboat"
          state: directory
        - path: "{{ ansible_facts.env.HOME }}/.newsboat/urls"
          src: ../Remote/newsboat.urls
          state: link
          force: yes

    - ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
      loop:
        - content: |
            [Unit]
            ConditionKernelCommandLine=bgreset
            After=gnome-session.target

            [Service]
            Type=oneshot
            ExecStart=/usr/bin/sh -c 'for k in "background picture-uri" "background picture-uri-dark" "screensaver picture-uri"; do gsettings set org.gnome.desktop.$k "file:///usr/share/backgrounds/f{{ ansible_facts.distribution_major_version }}/default/f{{ ansible_facts.distribution_major_version }}.xml"; done'

            [Install]
            WantedBy=gnome-session.target
          dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/bgreset.service"
        - content: |
            [Service]
            Type=oneshot
            ExecStart=/usr/bin/find %h/.config/mozilla/firefox -name xulstore.json -delete

            [Install]
            WantedBy=default.target
          dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/delxulstore.service"
        - content: |
            [Service]
            Type=oneshot
            ExecStart=/usr/bin/rclone sync remote: %h/Remote
          dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/rcsync.service"
        - content: |
            browser "firefox --new-tab %u > /dev/null 2>&1 &"
            reload-threads 2
          dest: "{{ ansible_facts.env.HOME }}/.newsboat/config"

    - ansible.builtin.hostname:
        name: "{{ ansible_facts.product_version | split | first | lower }}"
        use: systemd

    - ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: "{{ item.regexp | default(omit) }}"
        line: "{{ item.line }}"
        mode: "{{ item.mode | default(omit) }}"
        create: "{{ item.create | default(omit) }}"
      become: "{{ item.become | default(omit) }}"
      loop:
        - path: /etc/profile.d/sh.local
          regexp: ^export EDITOR=
          line: export EDITOR=/usr/bin/vim
          become: yes
        - path: /etc/profile.d/sh.local
          regexp: ^export HISTCONTROL=
          line: export HISTCONTROL=ignoreboth
          become: yes
        - path: "{{ ansible_facts.env.HOME }}/.bashrc"
          regexp: ^export DOCKER_HOST=
          line: export DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock
        - path: "{{ ansible_facts.env.HOME }}/.git-credentials"
          line: "{{ git_credential }}"
          mode: "600"
          create: yes

    - ansible.builtin.shell:
        cmd: "gnome-extensions info {{ item }} | grep 'Enabled: Yes' || gnome-extensions enable {{ item }}"
      register: shell_result
      changed_when: "'Enabled: Yes' not in shell_result.stdout"
      loop:
        - launch-new-instance@gnome-shell-extensions.gcampax.github.com
        - places-menu@gnome-shell-extensions.gcampax.github.com
        - window-list@gnome-shell-extensions.gcampax.github.com

    - ansible.builtin.systemd_service:
        name: "{{ item.name | default(omit) }}"
        daemon_reload: "{{ item.daemon_reload | default(omit) }}"
        enabled: "{{ item.enabled | default(omit) }}"
        scope: user
      loop:
        - daemon_reload: yes
        - name: bgreset.service
          enabled: yes
        - name: delxulstore.service
          enabled: yes
        - name: podman.socket
          enabled: yes

    - ansible.builtin.user:
        name: "{{ ansible_facts.user_id }}"
        append: yes
        groups: libvirt
      become: yes

    - community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop:
        - key: /org/gnome/Ptyxis/restore-session
          value: "false"
        - key: /org/gnome/Ptyxis/restore-window-size
          value: "false"
        - key: /org/gnome/desktop/calendar/show-weekdate
          value: "true"
        - key: /org/gnome/desktop/interface/clock-show-seconds
          value: "true"
        - key: /org/gnome/desktop/interface/clock-show-weekday
          value: "true"
        - key: /org/gnome/desktop/interface/color-scheme
          value: "'prefer-dark'"
        - key: /org/gnome/desktop/interface/enable-hot-corners
          value: "false"
        - key: /org/gnome/desktop/interface/gtk-enable-primary-paste
          value: "true"
        - key: /org/gnome/desktop/interface/show-battery-percentage
          value: "true"
        - key: /org/gnome/desktop/notifications/show-in-lock-screen
          value: "false"
        - key: /org/gnome/desktop/peripherals/touchpad/tap-to-click
          value: "false"
        - key: /org/gnome/desktop/privacy/remember-recent-files
          value: "false"
        - key: /org/gnome/desktop/session/idle-delay
          value: "uint32 900"
        - key: /org/gnome/desktop/sound/event-sounds
          value: "false"
        - key: /org/gnome/desktop/wm/keybindings/switch-applications
          value: "['<Super>Tab']"
        - key: /org/gnome/desktop/wm/keybindings/switch-applications-backward
          value: "['<Shift><Super>Tab']"
        - key: /org/gnome/desktop/wm/keybindings/switch-windows
          value: "['<Alt>Tab']"
        - key: /org/gnome/desktop/wm/keybindings/switch-windows-backward
          value: "['<Shift><Alt>Tab']"
        - key: /org/gnome/nautilus/preferences/default-folder-viewer
          value: "'list-view'"
        - key: /org/gnome/settings-daemon/plugins/color/night-light-enabled
          value: "true"
        - key: /org/gnome/settings-daemon/plugins/color/night-light-temperature
          value: "uint32 3700"
        - key: /org/gnome/settings-daemon/plugins/power/power-button-action
          value: "'interactive'"
        - key: /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type
          value: "'nothing'"
        - key: /org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type
          value: "'nothing'"
        - key: /org/gnome/shell/app-switcher/current-workspace-only
          value: "true"
        - key: /org/gnome/shell/favorite-apps
          value: "['org.mozilla.firefox.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Ptyxis.desktop', 'org.keepassxc.KeePassXC.desktop', 'mullvad-vpn.desktop']"

    - community.general.ini_file:
        path: "{{ item.path }}"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        create: "{{ item.create | default(omit) }}"
        no_extra_spaces: "{{ item.no_extra_spaces | default(omit) }}"
      become: "{{ item.become | default(omit) }}"
      loop:
        - path: /etc/gdm/custom.conf
          section: daemon
          option: AutomaticLoginEnable
          value: "True"
          create: no
          no_extra_spaces: yes
          become: yes
        - path: /etc/gdm/custom.conf
          section: daemon
          option: AutomaticLogin
          value: "{{ ansible_facts.user_id }}"
          create: no
          no_extra_spaces: yes
          become: yes
        - path: "{{ ansible_facts.env.HOME }}/.gitconfig"
          section: credential
          option: "\thelper"
          value: "store"
        - path: "{{ ansible_facts.env.HOME }}/.gitconfig"
          section: user
          option: "\temail"
          value: "{{ git_user_email }}"
        - path: "{{ ansible_facts.env.HOME }}/.gitconfig"
          section: user
          option: "\tname"
          value: "{{ git_user_name }}"

  vars:
    git_credential: !vault |
