---

# sudo dnf -y install ansible && ansible-playbook -J -K main.yml

- hosts: localhost

  vars:
    git_credential: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          37313963623931636462306637366161363134623236326563376232303862313239323438373161
          6631346361643861653361363530306464333433346530300a376233316164396231373965313938
          61663832363336656661353531636336343233333533356334353535633665626166383532633637
          6330616131363832640a383663383365333163623131343764636566306133623461333761353537
          64376662626435303334633638373730636365613537323462306265306335356133633539626164
          61613335396662313138323033646238383930356561373039343965663437366565346362626439
          33626161636636633337643063366263646331663431386435366630323237623266343161376531
          32636166313533346131
    git_user_email: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          36666566393530656132633464313739353962383630633434393333363066663163383234373038
          6134653462306336363532363066313932356339636133640a306638653733393566396137303732
          33333037396632633662393766323034643563356138633832353663313630653733366565366630
          3335626436643739370a366266366639353736623239353962323939386235353931616566656233
          37333261353830336530316137616137353263373836316134303265333439346534
    git_user_name: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          32623933303966333764303836336535343036656665653139373530616434643435626334626665
          6637643433333862343939666635316664306134646163390a616537303065313632383563383565
          30393530653761393539333536353030663863343338636364386164323433323936306163653437
          6138376262376131640a323037316463343039636637623232343033393264313631303237336639
          3034

  tasks:
    - import_tasks: containers.yml

    - import_tasks: packages.yml

    - ansible.builtin.command:
        cmd: firewall-cmd --set-default-zone=drop
      register: command_result
      changed_when: "'ZONE_ALREADY_SET' not in command_result.stderr"

    - ansible.builtin.hostname:
        name: "{{ ansible_facts.product_version | split | first | lower }}"
        use: systemd

    - ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: "{{ item.regexp | default(omit) }}"
        line: "{{ item.line }}"
        mode: "{{ item.mode | default(omit) }}"
        create: "{{ item.create | default(omit) }}"
      loop:
        - path: "{{ ansible_facts.env.HOME }}/.bashrc"
          regexp: ^export EDITOR=
          line: export EDITOR=/usr/bin/vim
        - path: "{{ ansible_facts.env.HOME }}/.bashrc"
          regexp: ^export HISTCONTROL=
          line: export HISTCONTROL=ignoreboth
        - path: "{{ ansible_facts.env.HOME }}/.git-credentials"
          line: "{{ git_credential }}"
          mode: "600"
          create: yes

    - ansible.builtin.shell:
        cmd: "{{ item.cmd | default(['curl', '--create-dirs', '--location', '--output', item.file, item.url | default(omit), '&&', 'chmod', '+x', item.file] | join(' ')) }}"
        creates: "{{ item.file }}"
      loop:
        - url: https://gist.githubusercontent.com/luudvig/160c757005be61102bac4e3128ab313e/raw/encrypt-symmetric.sh
          file: "{{ ansible_facts.env.HOME }}/.local/bin/encrypt-symmetric.sh"
        - url: https://gist.githubusercontent.com/luudvig/10d227c86139029e73f4fdfc763d768e/raw/two-pass.sh
          file: "{{ ansible_facts.env.HOME }}/.local/bin/two-pass.sh"
        - cmd: curl --location --output-dir /tmp --remote-name https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip && unzip -d {{ ansible_facts.env.HOME }}/.local/bin /tmp/deno-x86_64-unknown-linux-gnu.zip deno
          file: "{{ ansible_facts.env.HOME }}/.local/bin/deno"
        - url: https://svtplay-dl.se/download/latest/svtplay-dl
          file: "{{ ansible_facts.env.HOME }}/.local/bin/svtplay-dl"
        - url: https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          file: "{{ ansible_facts.env.HOME }}/.local/bin/yt-dlp"

    - ansible.builtin.shell:
        cmd: "gnome-extensions info {{ item }} | grep 'Enabled: Yes' || gnome-extensions enable {{ item }}"
      register: shell_result
      changed_when: "'Enabled: Yes' not in shell_result.stdout"
      loop:
        - launch-new-instance@gnome-shell-extensions.gcampax.github.com
        - places-menu@gnome-shell-extensions.gcampax.github.com
        - window-list@gnome-shell-extensions.gcampax.github.com

    - ansible.builtin.copy:
        content: |
          [Unit]
          Description=Reset background
          ConditionKernelCommandLine=bgreset
          After=gnome-session.target

          [Service]
          ExecStart=/usr/bin/bash -c 'for k in "background picture-uri" "background picture-uri-dark" "screensaver picture-uri"; do /usr/bin/gsettings set org.gnome.desktop.$k "file:///usr/share/backgrounds/f{{ ansible_facts.distribution_major_version }}/default/f{{ ansible_facts.distribution_major_version }}.xml"; done'

          [Install]
          WantedBy=gnome-session.target
        dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/bgreset.service"

    - ansible.builtin.systemd_service:
        name: bgreset.service
        daemon_reload: yes
        enabled: yes
        scope: user

    - community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop:
        - key: /org/gnome/Ptyxis/restore-session
          value: "false"
        - key: /org/gnome/Ptyxis/restore-window-size
          value: "false"
        - key: /org/gnome/desktop/calendar/show-weekdate
          value: "true"
        - key: /org/gnome/desktop/interface/clock-show-seconds
          value: "true"
        - key: /org/gnome/desktop/interface/clock-show-weekday
          value: "true"
        - key: /org/gnome/desktop/interface/color-scheme
          value: "'prefer-dark'"
        - key: /org/gnome/desktop/interface/enable-hot-corners
          value: "false"
        - key: /org/gnome/desktop/interface/show-battery-percentage
          value: "true"
        - key: /org/gnome/desktop/notifications/show-in-lock-screen
          value: "false"
        - key: /org/gnome/desktop/peripherals/touchpad/tap-to-click
          value: "false"
        - key: /org/gnome/desktop/privacy/remember-recent-files
          value: "false"
        - key: /org/gnome/desktop/session/idle-delay
          value: "uint32 900"
        - key: /org/gnome/desktop/sound/event-sounds
          value: "false"
        - key: /org/gnome/desktop/wm/keybindings/switch-applications
          value: "['<Super>Tab']"
        - key: /org/gnome/desktop/wm/keybindings/switch-applications-backward
          value: "['<Shift><Super>Tab']"
        - key: /org/gnome/desktop/wm/keybindings/switch-windows
          value: "['<Alt>Tab']"
        - key: /org/gnome/desktop/wm/keybindings/switch-windows-backward
          value: "['<Shift><Alt>Tab']"
        - key: /org/gnome/nautilus/preferences/default-folder-viewer
          value: "'list-view'"
        - key: /org/gnome/settings-daemon/plugins/color/night-light-enabled
          value: "true"
        - key: /org/gnome/settings-daemon/plugins/color/night-light-temperature
          value: "uint32 3700"
        - key: /org/gnome/settings-daemon/plugins/power/power-button-action
          value: "'interactive'"
        - key: /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type
          value: "'nothing'"
        - key: /org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type
          value: "'nothing'"
        - key: /org/gnome/shell/app-switcher/current-workspace-only
          value: "true"
        - key: /org/gnome/shell/favorite-apps
          value: "['org.mozilla.firefox.desktop', 'org.gnome.Nautilus.desktop', 'org.gnome.Ptyxis.desktop', 'mullvad-vpn.desktop', 'google-chrome.desktop', 'com.spotify.Client.desktop']"

    - community.general.ini_file:
        path: "{{ item.path }}"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        create: "{{ item.create | default(omit) }}"
        no_extra_spaces: "{{ item.no_extra_spaces | default(omit) }}"
      become: "{{ item.become | default(omit) }}"
      loop:
        - path: /etc/gdm/custom.conf
          section: daemon
          option: AutomaticLoginEnable
          value: "True"
          create: no
          no_extra_spaces: yes
          become: yes
        - path: /etc/gdm/custom.conf
          section: daemon
          option: AutomaticLogin
          value: "{{ ansible_facts.user_id }}"
          create: no
          no_extra_spaces: yes
          become: yes
        - path: "{{ ansible_facts.env.HOME }}/.gitconfig"
          section: credential
          option: "\thelper"
          value: "store"
        - path: "{{ ansible_facts.env.HOME }}/.gitconfig"
          section: user
          option: "\temail"
          value: "{{ git_user_email }}"
        - path: "{{ ansible_facts.env.HOME }}/.gitconfig"
          section: user
          option: "\tname"
          value: "{{ git_user_name }}"
