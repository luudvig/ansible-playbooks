---

# ansible-playbook -b -i 192.168.0.X, -k -u osmc main.yml

- hosts: all

  tasks:
    - ansible.builtin.apt:
        name: rsync

    - ansible.builtin.get_url:
        url: https://github.com/lbschenkel/plugin.video.svtplay/releases/latest/download/plugin.video.svtplay-5.1.22+lbschenkel.1.zip
        dest: /home/osmc
        checksum: sha256:632bcc2e375b1fd7f42da09c856f20ab0464e6d85b418b5dc5e237dd9e139863
        owner: osmc
        group: osmc

    - ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backrefs: "{{ item.backrefs | default(omit) }}"
        insertbefore: "{{ item.insertbefore | default(omit) }}"
      loop:
        - path: /boot/config-user.txt
          regexp: ^#?arm_freq=
          line: arm_freq=2000
        - path: /boot/config-user.txt
          regexp: ^#?gpu_freq=
          line: gpu_freq=750
        - path: /boot/config-user.txt
          regexp: ^#?over_voltage=
          line: over_voltage=6
        - path: /home/osmc/.bashrc
          regexp: ^#?TERM=
          line: TERM=xterm
          insertbefore: BOF
        - path: /home/osmc/.bashrc
          regexp: ^#?alias ll=(.*)
          line: alias ll=\1
          backrefs: yes
        - path: /home/osmc/.bashrc
          regexp: ^#?export LC_ALL=
          line: export LC_ALL=C.UTF-8

    - ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - path: /etc/ld.so.preload
          regexp: '^(\/usr\/lib\/libarmmem\.so)$'
          replace: '#\1'
        - path: /home/osmc/.bash_logout
          regexp: '^(\s*)(\[\s+-x\s+\/usr\/bin\/clear_console\s.*)$'
          replace: '\1: # \2'

    - ansible.builtin.raw: echo -e "{{ ansible_password }}\n{{ new_password }}\n{{ new_password }}" | passwd
      become_user: osmc
      when: new_password != "" and new_password != ansible_password

  vars_prompt:
    - name: new_password
      prompt: NEW password
      confirm: yes
