---

# sudo add-apt-repository -y ppa:ansible/ansible && sudo apt -U -y install ansible && ansible-playbook -J -K main.yml

- hosts: localhost

  tasks:
    - ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.config/systemd/user"
        state: directory

    - ansible.builtin.copy:
        content: "{{ item.content | default(omit) }}"
        src: "{{ item.src | default(omit) }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode | default(omit) }}"
        force: "{{ item.force | default(omit) }}"
        unsafe_writes: "{{ item.unsafe_writes | default(omit) }}"
      become: "{{ item.become | default(omit) }}"
      loop:
        - content: |
            [Unit]
            Description=Reset background
            ConditionKernelCommandLine=bgreset
            After=dbus.service

            [Service]
            ExecStart=/usr/bin/gsettings reset org.cinnamon.desktop.background picture-uri

            [Install]
            WantedBy=dbus.service
          dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/bgreset.service"
        - content: |
            [Unit]
            Description=Delete xulstore

            [Service]
            ExecStart=/usr/bin/find %h/.config/mozilla/firefox -name xulstore.json -delete

            [Install]
            WantedBy=default.target
          dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/delxulstore.service"
        - content: >
            75
          dest: /sys/class/power_supply/BAT0/charge_control_start_threshold
          unsafe_writes: yes
          become: yes
        - content: >
            80
          dest: /sys/class/power_supply/BAT0/charge_control_end_threshold
          unsafe_writes: yes
          become: yes
        - src: /etc/hosts
          dest: /etc/hosts.orig
          mode: a-w
          force: no
          become: yes

    - ansible.builtin.lineinfile:
        path: "{{ item.path }}"
        regexp: "{{ item.regexp | default(omit) }}"
        line: "{{ item.line }}"
        mode: "{{ item.mode | default(omit) }}"
        create: "{{ item.create | default(omit) }}"
      loop:
        - path: "{{ ansible_facts.env.HOME }}/.bashrc"
          regexp: ^alias cpn=
          line: alias cpn='cp --update=none'
        - path: "{{ ansible_facts.env.HOME }}/.bashrc"
          regexp: ^alias mvn=
          line: alias mvn='mv --update=none'
        - path: "{{ ansible_facts.env.HOME }}/.bashrc"
          regexp: ^alias rclone-sync=
          line: alias rclone-sync='rclone sync remote:/ ~/Remote'
        - path: "{{ ansible_facts.env.HOME }}/.bashrc"
          regexp: ^export EDITOR=
          line: export EDITOR=/usr/bin/vim
        - path: "{{ ansible_facts.env.HOME }}/.git-credentials"
          line: "{{ git_credential }}"
          mode: "600"
          create: yes

    - ansible.builtin.systemd_service:
        name: "{{ item.name | default(omit) }}"
        daemon_reload: "{{ item.daemon_reload | default(omit) }}"
        enabled: "{{ item.enabled | default(omit) }}"
        scope: user
      loop:
        - daemon_reload: yes
        - name: bgreset.service
          enabled: yes
        - name: delxulstore.service
          enabled: yes

    - community.general.dconf:
        key: "{{ item.key }}"
        value: "{{ item.value }}"
      loop:
        - key: /org/cinnamon/alttab-switcher-style
          value: "'thumbnails'"
        - key: /org/cinnamon/desktop/interface/clock-show-seconds
          value: "true"
        - key: /org/cinnamon/desktop/interface/first-day-of-week
          value: "1"
        - key: /org/cinnamon/desktop/keybindings/wm/maximize
          value: "['<Super>Up']"
        - key: /org/cinnamon/desktop/keybindings/wm/push-tile-down
          value: "@as []"
        - key: /org/cinnamon/desktop/keybindings/wm/push-tile-up
          value: "@as []"
        - key: /org/cinnamon/desktop/keybindings/wm/unmaximize
          value: "['<Super>Down']"
        - key: /org/cinnamon/desktop/media-handling/autorun-never
          value: "true"
        - key: /org/cinnamon/desktop/peripherals/touchpad/click-method
          value: "'fingers'"
        - key: /org/cinnamon/desktop/peripherals/touchpad/tap-to-click
          value: "false"
        - key: /org/cinnamon/desktop/privacy/remember-recent-files
          value: "false"
        - key: /org/cinnamon/muffin/tile-maximize
          value: "true"
        - key: /org/cinnamon/panels-enabled
          value: "['1:0:left']"
        - key: /org/cinnamon/settings-daemon/plugins/color/night-light-enabled
          value: "true"
        - key: /org/cinnamon/settings-daemon/plugins/color/night-light-temperature
          value: "uint32 3700"
        - key: /org/cinnamon/settings-daemon/plugins/power/idle-dim-battery
          value: "false"
        - key: /org/cinnamon/settings-daemon/plugins/power/sleep-display-ac
          value: "900"
        - key: /org/cinnamon/settings-daemon/plugins/power/sleep-display-battery
          value: "900"
        - key: /org/nemo/desktop/desktop-layout
          value: "'false::false'"
        - key: /org/nemo/preferences/default-folder-viewer
          value: "'compact-view'"

    - community.general.ini_file:
        path: "{{ item.path }}"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: "{{ item.no_extra_spaces | default(omit) }}"
      become: "{{ item.become | default(omit) }}"
      loop:
        - path: /etc/lightdm/slick-greeter.conf
          section: Greeter
          option: background
          value: ""
          no_extra_spaces: yes
          become: yes
        - path: /etc/lightdm/slick-greeter.conf
          section: Greeter
          option: draw-user-backgrounds
          value: "false"
          no_extra_spaces: yes
          become: yes
        - path: "{{ ansible_facts.env.HOME }}/.gitconfig"
          section: credential
          option: "\thelper"
          value: "store"
        - path: "{{ ansible_facts.env.HOME }}/.gitconfig"
          section: user
          option: "\temail"
          value: "{{ git_user_email }}"
        - path: "{{ ansible_facts.env.HOME }}/.gitconfig"
          section: user
          option: "\tname"
          value: "{{ git_user_name }}"

    - import_tasks: software.yml

